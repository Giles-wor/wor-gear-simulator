name: Sync game data

on:
  schedule:
    # 매주 월요일 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # 머지 후 deploy 워크플로 실행용

concurrency:
  group: "sync-data"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync heroes (Fandom crawl)
        run: npm run sync:heroes

      - name: Sync summon rates (best-effort crawl)
        run: npm run sync:summon
        continue-on-error: true

      - name: Sync upcoming banners (prospector.gg crawl)
        run: npm run sync:banners
        continue-on-error: true

      - name: Sync 마병 아이콘 (없는 것만 받고, 목록에서 빠진 것은 삭제)
        run: npm run sync:soldiers
        continue-on-error: true

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:summon
          npm run typecheck:banners

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/auto-sync
          title: "chore: refresh crawled game data"
          commit-message: "chore: refresh crawled hero & summon data"
          # 크롤 결과 데이터 파일만 커밋 — 실패 시 생성되는 _debug_fetch.txt 등이 딸려가지 않게.
          add-paths: |
            src/data/heroes.generated.ts
            summon/data/banners.generated.ts
            banners/data/schedule.generated.ts
            guild/assets/soldiers
          body: |
            자동 크롤 갱신 (sync:heroes / sync:summon / sync:banners / sync:soldiers).
            소환율·배너 파싱은 best-effort 이며 소스 차단/구조 변경 시 기존 데이터 유지.
          delete-branch: true

      # 데이터 PR 은 자동 생성 결과라 리뷰가 병목이 되어 방치되기 쉬움 → 곧바로 머지해 배포에 반영.
      - name: Auto-merge data PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}"; then
            # 봇(GITHUB_TOKEN) 머지는 deploy 워크플로의 push 트리거를 깨우지 않음 → 직접 실행해야 사이트에 반영됨.
            gh workflow run deploy.yml --ref main
          else
            echo "자동 머지 실패 — PR #${{ steps.cpr.outputs.pull-request-number }} 수동 머지 필요"
          fi
