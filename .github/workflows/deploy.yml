name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # 카톡 방장봇용 길드 집계 이미지(dist/stats/…)를 매시간 최신 데이터로 다시 만들기 위한 재배포
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (v0 DPS simulator)
        run: npm run build

      - name: Build (소환 확률 계산기)
        run: npm run build:summon

      - name: Build (장비 필터)
        run: npm run build:gear

      - name: Build (공략)
        run: npm run build:guide

      - name: Build (다가오는 배너)
        run: npm run build:banners

      - name: Build (유출정보)
        run: npm run build:leaks

      - name: Build (길드전 리더보드)
        run: npm run build:gvg

      - name: Build (길드원 전용)
        run: npm run build:guild

      - name: 길드 집계 이미지 (카톡 방장봇용)
        # 실패해도 사이트 배포는 계속
        continue-on-error: true
        env:
          GUILD_CODE: ${{ secrets.GUILD_CODE }}
          GUILD_STATS_SALT: ${{ secrets.GUILD_STATS_SALT }}
        run: |
          if [ -n "$GUILD_CODE" ] && [ -n "$GUILD_STATS_SALT" ] && ! fc-list :lang=ko | grep -q .; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null
          fi
          npm run render:guild-stats

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # upload-pages-artifact 는 tar 파일 목록을 공개 로그에 찍어서 stats/<토큰>/ 주소가 드러남.
      # 같은 형식(artifact.tar, 이름 github-pages)으로 목록 출력 없이 직접 묶어 올림.
      - name: Archive site (파일 목록 출력 안 함)
        run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
