name: Fetch WoR wiki

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Wiki full-text search query"
        required: true
        default: "Fixed Damage"
      pages:
        description: "추가로 본문을 강제로 뜯을 페이지(쉼표구분, 선택)"
        required: false
        default: "Fixed Damage,Count Dracula,Hellfire Emperor,Gretchen,Faelin,Dolores,Sun Wukong,Xaris,Beatrix,Kria"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Search + dump rendered skill text
        env:
          Q: ${{ inputs.query }}
          PAGES: ${{ inputs.pages }}
        run: |
          python3 - <<'PY'
          import os, json, re, time, html, urllib.parse, urllib.request
          API = "https://watcher-of-realms.fandom.com/api.php"
          UA = {"User-Agent": "wor-gear-simulator/0.1 (+github actions)"}

          def get(params):
              params = {**params, "format": "json"}
              url = API + "?" + urllib.parse.urlencode(params)
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30))

          q = os.environ.get("Q", "Fixed Damage")
          res = get({"action": "query", "list": "search", "srsearch": q, "srnamespace": 0, "srlimit": 120})
          found = [h["title"] for h in res.get("query", {}).get("search", [])]
          print(f"SEARCH '{q}' → {len(found)} pages\n{found}\n")

          extra = [p.strip() for p in os.environ.get("PAGES", "").split(",") if p.strip()]
          # 검색결과의 /Labs,/Builds 는 베이스 영웅 페이지로 환원해서 합침
          bases = {t.split("/")[0] for t in found}
          titles = []
          for t in list(dict.fromkeys(extra + found + sorted(bases))):
              if t not in titles:
                  titles.append(t)

          def rendered(t):
              r = get({"action": "parse", "page": t, "prop": "text", "redirects": 1})
              h = r.get("parse", {}).get("text", {}).get("*", "")
              h = re.sub(r"(?is)<(script|style|table class=\"navbox).*?</\1>", " ", h)
              h = re.sub(r"(?s)<[^>]+>", " ", h)
              h = html.unescape(h)
              return re.sub(r"\s+", " ", h)

          KEY = re.compile(r"fixed damage", re.I)
          for t in titles:
              try:
                  text = rendered(t)
              except Exception as e:
                  print(f"#### {t}  (ERR {e})")
                  continue
              wins, seen = [], set()
              for m in KEY.finditer(text):
                  a = max(0, m.start() - 160); b = min(len(text), m.end() + 160)
                  snip = text[a:b].strip()
                  key = snip[:40]
                  if key not in seen:
                      seen.add(key); wins.append(snip)
              if wins:
                  print(f"\n#### {t}  ({len(wins)} hit)")
                  for w in wins[:6]:
                      print("  …", w)
              time.sleep(0.15)
          PY
