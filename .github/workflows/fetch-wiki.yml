name: Fetch WoR wiki

on:
  workflow_dispatch:
    inputs:
      terms:
        description: "검색어(쉼표구분)"
        required: false
        default: "True DMG,True Damage"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Find True-DMG (고정피해) heroes
        env:
          TERMS: ${{ inputs.terms }}
        run: |
          python3 - <<'PY'
          import os, json, re, time, html, urllib.parse, urllib.request
          API = "https://watcher-of-realms.fandom.com/api.php"
          UA = {"User-Agent": "wor-gear-simulator/0.1 (+github actions)"}

          def get(params):
              params = {**params, "format": "json"}
              url = API + "?" + urllib.parse.urlencode(params)
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30))

          terms = [t.strip() for t in os.environ.get("TERMS", "True DMG").split(",") if t.strip()]
          found = []
          for q in terms:
              r = get({"action": "query", "list": "search", "srsearch": q, "srnamespace": 0, "srlimit": 100})
              found += [h["title"] for h in r.get("query", {}).get("search", [])]
          # /Labs,/Builds 는 베이스로 환원
          titles = list(dict.fromkeys(t.split("/")[0] for t in found))
          print(f"{len(titles)} candidate pages\n{titles}\n")

          def rendered(t):
              r = get({"action": "parse", "page": t, "prop": "text", "redirects": 1})
              h = r.get("parse", {}).get("text", {}).get("*", "")
              h = re.sub(r"(?is)<(script|style).*?</\1>", " ", h)
              h = re.sub(r"(?s)<[^>]+>", " ", h)
              return re.sub(r"\s+", " ", html.unescape(h))

          # 'True DMG'/'True Damage' (단, 일반 정의 문장 'True Damage cannot crit' 도 포함)
          RX = re.compile(r"true[\s \-]*(?:dmg|damage)", re.I)
          hero_hits = []
          for t in titles:
              try:
                  text = rendered(t)
              except Exception as e:
                  print(f"#### {t} (ERR {e})"); continue
              wins, seen = [], set()
              for m in RX.finditer(text):
                  a = max(0, m.start() - 150); b = min(len(text), m.end() + 150)
                  s = text[a:b].strip()
                  if s[:50] not in seen:
                      seen.add(s[:50]); wins.append(s)
                  if len(wins) >= 5: break
              if wins:
                  hero_hits.append(t)
                  print(f"\n#### {t}  ({len(wins)}+)")
                  for s in wins:
                      print("  …", s)
              time.sleep(0.12)
          print("\n==== TRUE-DMG PAGES ====")
          print(hero_hits)
          PY
