name: Fetch Google Sheet

on:
  workflow_dispatch:
    inputs:
      sheet_id:
        description: "Google Spreadsheet ID"
        required: true
        default: "1CAzToY3XZuUnOL0wBf3IPRQOnn5el4A-lxPv9wK9C5M"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install -U openpyxl requests

      - name: Dump all sheets
        env:
          SID: ${{ inputs.sheet_id }}
        run: |
          python3 - <<'PY'
          import os, io, requests, openpyxl
          sid = os.environ["SID"]
          url = f"https://docs.google.com/spreadsheets/d/{sid}/export?format=xlsx"
          r = requests.get(url, timeout=30, headers={"User-Agent": "Mozilla/5.0"})
          print("HTTP", r.status_code, "bytes", len(r.content))
          r.raise_for_status()
          wb = openpyxl.load_workbook(io.BytesIO(r.content), data_only=True, read_only=True)
          print("SHEETS:", wb.sheetnames)
          for ws in wb.worksheets:
              print(f"\n########## SHEET: {ws.title} ({ws.max_row}x{ws.max_column}) ##########")
              for row in ws.iter_rows(values_only=True):
                  cells = ["" if c is None else str(c).replace("\n", " ").strip() for c in row]
                  if not any(cells):
                      continue
                  # 우측 빈 셀 제거
                  while cells and cells[-1] == "":
                      cells.pop()
                  print(" | ".join(cells))
          PY
